name: Web CI/CD

# Escopo deste workflow: FileSharing.Web (Blazor Server). Ver backend.yml para a Api e
# mobile.yml para o Mobile — cada um roda em runners/SDKs diferentes, ver docs/ci-cd.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  validate:
    name: Build, format & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Nunca src/FileSharing.Mobile aqui — mesmo motivo do backend.yml (workload MAUI).
      - name: Restore
        run: dotnet restore src/FileSharing.Web/FileSharing.Web.csproj

      - name: Build
        run: dotnet build src/FileSharing.Web/FileSharing.Web.csproj --no-restore -c Release

      - name: Format validation
        run: |
          set -e
          for proj in \
            src/FileSharing.Web/FileSharing.Web.csproj \
            tests/FileSharing.Web.Tests/FileSharing.Web.Tests.csproj; do
            echo "::group::dotnet format $proj"
            dotnet format "$proj" --verify-no-changes --no-restore || FAILED_FORMAT="$FAILED_FORMAT $proj"
            echo "::endgroup::"
          done
          if [ -n "$FAILED_FORMAT" ]; then
            echo "::error::Formatação inválida em:$FAILED_FORMAT — rode 'dotnet format <projeto>' localmente e comite o resultado."
            exit 1
          fi

      - name: Dependency / security audit (NuGet)
        run: |
          set -eo pipefail
          OUTPUT=$(dotnet list src/FileSharing.Web/FileSharing.Web.csproj package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Pacotes NuGet vulneráveis encontrados — ver o output acima. Avaliar upgrade ou pin em Directory.Packages.props antes de prosseguir."
            exit 1
          fi

  test:
    name: Web tests (bUnit)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Test — FileSharing.Web.Tests
        run: dotnet test tests/FileSharing.Web.Tests/FileSharing.Web.Tests.csproj -c Release

  docker-build:
    name: Docker build (Web)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FileSharing.Web/Dockerfile
          push: false
          tags: filesharing-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Ver backend.yml para os comentários completos sobre OIDC, skip explícito quando AWS ainda não
  # está configurada, tagging por SHA, e por que a task definition é baixada do ECS em vez de
  # reconstruída neste repositório. O Web não tem passo de migração (não acessa o Postgres) nem
  # /health/ready (só liveness, ver docs/deployment.md) — smoke test usa só /health/live.
  deploy:
    name: Deploy Web to ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production-deploy-web
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: filesharing-web
      ECS_CLUSTER: filesharing-cluster
      ECS_SERVICE: filesharing-web
      ECS_TASK_FAMILY: filesharing-web
      ECS_CONTAINER_NAME: web
    steps:
      - name: Skip if AWS deployment is not configured yet
        id: gate
        run: |
          if [ -z "${{ vars.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "::warning::AWS_ROLE_TO_ASSUME não configurado no ambiente 'production' — deploy pulado. Ver docs/ci-cd.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - name: Configure AWS credentials via OIDC
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.skip == 'false'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip == 'false'

      - name: Build and push image
        if: steps.gate.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FileSharing.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Download current task definition
        if: steps.gate.outputs.skip == 'false'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render new image into task definition
        if: steps.gate.outputs.skip == 'false'
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Health check
        if: steps.gate.outputs.skip == 'false'
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent "https://${{ vars.WEB_PUBLIC_HOSTNAME }}/health/live"; then
              echo "Health check OK."
              exit 0
            fi
            echo "Tentativa $i/10 falhou, aguardando..."
            sleep 10
          done
          echo "::error::/health/live não respondeu com sucesso após o deploy."
          exit 1

      - name: Smoke test
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -e
          curl --fail --silent "https://${{ vars.WEB_PUBLIC_HOSTNAME }}/health/live" > /dev/null
          curl --fail --silent --output /dev/null "https://${{ vars.WEB_PUBLIC_HOSTNAME }}/"
          echo "Smoke test OK — /health/live e a landing page respondendo depois do deploy."
